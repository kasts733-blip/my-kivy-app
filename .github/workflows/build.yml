name: build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk unzip libffi-dev libssl-dev libtinfo5 cmake autoconf automake
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
          rm -rf .buildozer

      - name: Accept licenses
        run: |
          mkdir -p $HOME/.android/licenses
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/.android/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/.android/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea11e33" >> $HOME/.android/licenses/android-sdk-license
          cp -r $HOME/.android/licenses $HOME/.buildozer/android/platform/android-sdk/ || true

      - name: Build APK
        run: buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
