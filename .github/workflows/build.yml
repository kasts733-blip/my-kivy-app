name: build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Build APK
        run: |
          docker run --volume $PWD:/home/user/hostcwd kivy/buildozer:master buildozer android debug
      
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
